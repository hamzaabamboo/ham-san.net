name: Import photo catalog

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Gzip/base64 photo snapshot
        required: false
        type: string
      inspect:
        description: Inspect deployment state without changing it
        required: true
        type: boolean
        default: true
      cleanup_unused_images:
        description: Remove unused images belonging only to this project during inspection
        required: true
        type: boolean
        default: false
      write:
        description: Write and verify catalog records
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: '1'
      PHOTO_CATALOG_SNAPSHOT_GZIP_BASE64: ${{ inputs.snapshot }}
      PHOTO_CATALOG_WRITE: ${{ inputs.write }}
      PHOTO_CATALOG_INSPECT: ${{ inputs.inspect }}
      CLEANUP_UNUSED_IMAGES: ${{ inputs.cleanup_unused_images }}
    steps:
      - name: Import through the deployed API image
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          envs: PHOTO_CATALOG_SNAPSHOT_GZIP_BASE64,PHOTO_CATALOG_WRITE,PHOTO_CATALOG_INSPECT,CLEANUP_UNUSED_IMAGES
          script: |
            set -eu
            export DO_NOT_TRACK=1
            cd ./ham-san-net
            if [ "$PHOTO_CATALOG_INSPECT" = true ]; then
              git status --short
              git diff --stat
              git rev-parse HEAD
              docker inspect --format '{{.Image}}' strapi
              docker compose ps api
              df -k .
              docker exec strapi df -k /usr/src/app
              docker image ls --no-trunc --digests --filter 'reference=registry.ham-san.net/ham-san-net-*' --format '{{.ID}} {{.Repository}}:{{.Tag}} {{.Digest}} {{.Size}}'
              docker inspect --format '{{.Name}} {{.Image}}' strapi astro
              if [ "$CLEANUP_UNUSED_IMAGES" = true ]; then
                mkdir -p .scratch/deployment
                docker image ls --no-trunc --filter 'reference=registry.ham-san.net/ham-san-net-*' --format '{{.ID}} {{.Repository}} {{.Tag}}' > .scratch/deployment/project-images.txt
                while read -r image repository tag; do
                  case "$repository" in
                    registry.ham-san.net/ham-san-net-api|registry.ham-san.net/ham-san-net-astro) ;;
                    *) continue ;;
                  esac
                  if [ "$tag" = '<none>' ]; then continue; fi
                  holders=$(docker container ls -a --filter "ancestor=$image" --format '{{.ID}}')
                  if [ -n "$holders" ]; then continue; fi
                  docker image rm "$repository:$tag"
                done < .scratch/deployment/project-images.txt
                df -k .
                docker exec strapi df -k /usr/src/app
              fi
              exit 0
            fi
            test -n "$PHOTO_CATALOG_SNAPSHOT_GZIP_BASE64"
            git diff --quiet
            git diff --cached --quiet
            eval "$(ssh-agent -s)"
            cleanup() {
              result=$?
              trap - EXIT
              if [ "${api_stopped:-false}" = true ]; then
                docker compose up -d --no-deps api || result=$?
              fi
              ssh-agent -k >/dev/null || true
              exit "$result"
            }
            trap cleanup EXIT
            ssh-add - <<< "${{ secrets.GH_PRIVATE_KEY }}"
            git fetch origin "${{ github.sha }}"
            git checkout --detach "${{ github.sha }}"
            export API_IMAGE="$(docker inspect --format '{{.Image}}' strapi)"
            case "$API_IMAGE" in
              sha256:*) ;;
              *) exit 1 ;;
            esac
            set --
            if [ "$PHOTO_CATALOG_WRITE" = true ]; then
              set -- --write
            fi
            api_stopped=true
            docker compose stop api
            docker compose run --rm --no-deps --pull never -T \
              -e DO_NOT_TRACK=1 \
              -e STRAPI_TELEMETRY_DISABLED=true \
              -e PHOTO_CATALOG_SNAPSHOT_GZIP_BASE64 \
              -v "$PWD/apps/api/scripts/import-photo-catalog.cjs:/opt/import-photo-catalog.cjs:ro" \
              api node /opt/import-photo-catalog.cjs "$@"
