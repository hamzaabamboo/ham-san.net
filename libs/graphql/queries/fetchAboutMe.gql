query fetchAboutMe($locale: I18NLocaleCode, $includeFallback: Boolean! = false) {
  aboutMe(locale: $locale) {
    introduction
  }
  experiences(locale: $locale, sort: ["start:desc"]) {
    ...experience
    localizations {
      ...experience
    }
  }
  educations(locale: $locale, sort: ["start:desc"]) {
    ...education
    localizations {
      ...education
    }
  }
  fallbackExperiences: experiences(locale: "en", sort: ["start:desc"])
    @include(if: $includeFallback) {
    ...experience
    localizations {
      ...experience
    }
  }
  fallbackEducations: educations(locale: "en", sort: ["start:desc"])
    @include(if: $includeFallback) {
    ...education
    localizations {
      ...education
    }
  }
  tags(locale: $locale, sort: ["order:asc"], pagination: { limit: 100 }) {
    ...tag
    projects(pagination: { limit: 100 }) {
      id: documentId
    }
    experiences(pagination: { limit: 100 }) {
      id: documentId
    }
  }
}
